name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Link tải chỉ có trong bản build từ 2026-10-09 00:00 giờ VN (RELEASE_AT trong src/data/facts.js), mà trang
  # là trang tĩnh: build lại lúc 00:05 ngày đó (17:05 UTC ngày 8/10) để link tự hiện. Qua ngày đó thì xoá lịch
  # này; để quên thì mỗi năm nó chỉ deploy lại main một lần.
  schedule:
    - cron: "5 17 8 10 *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=veilus-website
